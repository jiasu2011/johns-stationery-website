<html>
    <head>
        <title>Cart</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/x-icon" href="Images/favicon.jpeg">
    </head>
    <body>
        <script>
            let retString = localStorage.getItem("buyerplaceholder");
            let buyer = JSON.parse(retString);
            let retString2 = localStorage.getItem("priceplaceholder");
            let price = JSON.parse(retString2);
            window.onload = function () {
                let number = Number(localStorage.getItem('cartsize'));
                buyer[number] = localStorage.getItem('product');
                price[number] = localStorage.getItem('price');
                for (let i = 0; i < number + 1; i++) {
                    document.getElementById(`output`).innerHTML += `<a class = "cart-content-text" id = "cartname${i}">${buyer[i]}<br><a>`;
                    document.getElementById(`price`).innerHTML += `<a class = "cart-content-text" id = "cartprice${i}">${price[i]}<br><a>`;
                };
                let string = JSON.stringify(buyer);
                localStorage.setItem("buyerplaceholder", string);
                let string2 = JSON.stringify(price);
                localStorage.setItem("priceplaceholder", string2);
            };
        </script>
        <div style = "padding: 100px;">
            <h1 style = "color: white; font-size: 3em; display: inline;">Order Items |</h1>
            <a style = "color: red; font-size: 2.5em; display: inline;">ぶんぼうぐ を ちゅうもん</a>
            <div class = "cart">
                <div class = "cart-content" id = "output"></div>
                <div class = "cart-content" id = "price"></div>
            </div>
            <script type="module">
                import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
                const supabase = createClient(
                    'https://kceedhafsycrkshageoo.supabase.co',
                    'sb_publishable_jpnIDlMTvbLDQ6pJ5C4llA_e02j1Kim'
                )      
                let number = Number(localStorage.getItem('cartsize'));
                document.getElementById('product-form').addEventListener('submit', async (event) => {
                    for (let i = 0; i < number + 1; i++) {
                        event.preventDefault()
                        const name = document.getElementById(`cartname${i}`).textContent
                        const prevprice = document.getElementById(`cartprice${i}`).textContent
                        const price = prevprice.replace(/\D/g, "");
                        const buyer = document.getElementById('product-buyer').value
                        const email = document.getElementById('product-email').value
                        const id = localStorage.getItem('orderid')
                        const { data, error } = await supabase
                            .from('stationery_orders')
                            .insert({  
                            id: Number(id) + Number(i) + 1,
                            name: name,
                            price: price,
                            buyer: buyer,
                            email: email,
                            })
                        if (error) {
                            console.error('Insert error:', error.message)
                            alert(error.message)
                            return
                        }
                        console.log('Product added:', data)
                        alert('Order saved successfully!')
                    }
                })
            </script>
            <script type = "module">
                    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
                    const supabase2 = createClient(
                        'https://kceedhafsycrkshageoo.supabase.co',
                        'sb_publishable_jpnIDlMTvbLDQ6pJ5C4llA_e02j1Kim'
                    )      
                    const { data, error } = await supabase2
                        .from ('stationery_orders')                
                        .select('id')
                        .order('id', { ascending: false })
                        .limit(1)
                    const id = data?.[0]?.id
                    localStorage.setItem('orderid', id);
            </script>
        </div>
        <div style = "padding-left: 50px;">
            <form id="product-form" style = "display: grid; justify-content: left;">
                <input id="product-buyer" type="text" placeholder="Name" required="">
                <input id="product-email" type="text" placeholder="Email" required="">
                <div style = "display: flex; justify-content: space-evenly; padding: 20px;">
                    <button class = "btn btn-primary" type="submit">Save</button>
                    <button class = "btn btn-outline" style = "display: block; margin-left: 20px;" onclick="localStorage.clear(); window.location.reload();">Submit</button>
                </div>
            </form>
        </div>
    </body>
</html>
